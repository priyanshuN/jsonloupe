name: publish

# Publishing happens here rather than from a laptop so npm can attach a
# provenance attestation: a verifiable link from the published tarball back to
# the exact public commit and workflow that produced it. For a package whose
# whole pitch is "audit it, nothing leaves your machine", a signed origin is
# part of the product.
#
# There is no npm credential in this repository. The registry trusts this
# workflow, by filename, in this repository (npm "trusted publishing", set up
# 2026-08-01 after the token-authenticated first publish of 1.0.0), and
# authenticates it with a short-lived OIDC token minted per run by the
# id-token permission below. Do not add a NODE_AUTH_TOKEN back: a stored token
# takes precedence over OIDC, so adding one silently disables trusted
# publishing while the npm page still claims it is on.
#
# A release needs no hands after its version bump merges. When main's
# package.json names a version that is not out yet, this workflow publishes
# it to npm, tags it vX.Y.Z with a GitHub Release whose notes are its
# CHANGELOG.md entry, and lists it in the MCP Registry. The plan job checks
# each of the three first, so a run that failed half way can simply be re-run.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish (leave off for a rehearsal)"
        type: boolean
        default: false

permissions:
  contents: read

# Two merges in a row must not publish the same version twice.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.todo.outputs.version }}
      npm: ${{ steps.todo.outputs.npm }}
      release: ${{ steps.todo.outputs.release }}
      registry: ${{ steps.todo.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      - name: Find what this version still needs
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
          # Only main publishes. A push run always does; a manual run only
          # with the publish box ticked, and otherwise rehearses the build.
          LIVE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./server.json').name")"
          npm=no; release=no; registry=no
          if [ "$LIVE" = true ]; then
            npm view "jsonloupe@$version" version > /dev/null 2>&1 || npm=yes
            gh release view "v$version" > /dev/null 2>&1 || release=yes
            listed="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version")"
            [ "$listed" = 200 ] || registry=yes
          fi
          echo "jsonloupe $version still needs: npm $npm, GitHub Release $release, MCP Registry $registry (live: $LIVE)"
          { echo "version=$version"; echo "npm=$npm"; echo "release=$release"; echo "registry=$registry"; } >> "$GITHUB_OUTPUT"

      - name: The changelog must describe this version
        run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null

  npm:
    needs: plan
    # A rehearsal runs the tests and the build, and stops before publishing.
    if: needs.plan.outputs.npm == 'yes' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token: registry auth (post-token) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      # OpenSSF Gold dynamic analysis: the full assertion-rich test suite has
      # >80% branch coverage and is run against every proposed release.
      - run: npm run coverage -- --coverage.reporter=text
      - run: npm run build # tsc --noEmit + vite build; prepublishOnly reruns both at publish

      - name: Refuse to publish while the package is marked private
        if: needs.plan.outputs.npm == 'yes'
        run: |
          node -e "if (require('./package.json').private) {
            console.error('package.json still has \"private\": true — remove it deliberately before releasing');
            process.exit(1);
          }"

      # A rehearsal run proves the build, NOT the auth — the publish step is
      # skipped entirely, so authentication is never touched.
      - name: Publish with provenance
        if: needs.plan.outputs.npm == 'yes'
        run: npm publish --provenance --access public

      - name: Nothing was published
        if: needs.plan.outputs.npm != 'yes'
        run: echo "Build and tests passed. This was a rehearsal, or npm already has this version."

  release:
    needs: [plan, npm]
    # The tag follows npm, so a vX.Y.Z tag always names a published version.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'yes' && needs.plan.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the vX.Y.Z tag and its GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag vX.Y.Z with the changelog entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  registry:
    needs: [plan, npm]
    if: ${{ !cancelled() && needs.plan.outputs.registry == 'yes' && needs.plan.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the MCP Registry trusts GitHub's OIDC token for io.github.priyanshuN/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      # The registry reads mcpName from the published package.json, and npm
      # can take minutes to serve a version it has just accepted.
      - name: Wait until npm serves this version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          for _ in $(seq 30); do
            npm view "jsonloupe@$VERSION" version --prefer-online > /dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "npm still does not serve jsonloupe@$VERSION after 10 minutes"
          exit 1

      - name: List this version in the MCP Registry
        env:
          PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "$PUBLISHER_URL"
          echo "$PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
