name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default types miss draft→ready, which left required checks stuck on
    # "Expected" with nothing running. Base retargets fire no usable event at
    # all — workflow_dispatch is the escape hatch for those (Actions → Run).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint:contract
      - run: npm run lint:security
      - run: npm run coverage -- --coverage.reporter=text
      - run: npm run build
      - run: npm run smoke:mcp
      - run: npm run check:repeatable-build
