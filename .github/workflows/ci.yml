name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default types miss draft→ready, which left required checks stuck on
    # "Expected" with nothing running. Base retargets fire no usable event at
    # all — workflow_dispatch is the escape hatch for those (Actions → Run).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out GitHub's merge commit. Two commits deep
          # reaches its first parent, the base branch, which the docs check
          # diffs against.
          fetch-depth: 2
      # Docs-only fast path. When every file a pull request changes is
      # Markdown, the steps Markdown cannot affect are skipped: the build, the
      # browser tests, the MCP smoke test and the reproducible build. Install,
      # audit, lint and the unit tests still run, because tests read
      # README.md, SECURITY.md and RELEASING.md. The job still reports, so the
      # required "test" check passes instead of waiting forever; pushes to
      # main always run everything. --no-renames lists both sides of a rename,
      # so moving code into a .md path is not docs-only.
      - id: changes
        if: github.event_name == 'pull_request'
        run: |
          # If the diff fails, docs_only stays unset and everything runs.
          files=$(git diff --name-only --no-renames HEAD^1 HEAD) || exit 0
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! grep -qv '\.md$' <<< "$files"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs only: skipping the build, browser tests, MCP smoke test and reproducible build."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint:contract
      - run: npm run lint:headers
      - run: npm run lint:security
      - run: npm run coverage -- --coverage.reporter=text
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
      - if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:a11y
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run smoke:mcp
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:reproducible-build
