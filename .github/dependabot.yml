version: 2

# Both ecosystems, because a compromised action is as good as a compromised
# dependency: the workflows deploy the public site, so what runs in them
# matters as much as what ships in the bundle.
# Monthly, one grouped PR per ecosystem: CI decides whether a bump is safe,
# and a single PR a month is reviewable where a dozen weekly ones were not.
# Security updates are not affected: Dependabot opens those as soon as an
# advisory lands, outside this schedule.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # One group also keeps CodeQL init, analyze and upload-sarif on the same
      # release, which they need (they exchange versioned state).
      actions:
        patterns: ["*"]
